name: Validate pull request

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    name: Classify changes
    outputs:
      lean: ${{ steps.changes.outputs.lean }}
      blueprint: ${{ steps.changes.outputs.blueprint }}
      homepage: ${{ steps.changes.outputs.homepage }}
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify changes
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "lean=true" >> "$GITHUB_OUTPUT"
            echo "blueprint=true" >> "$GITHUB_OUTPUT"
            echo "homepage=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="origin/${{ github.base_ref }}...HEAD"

          # Workflow changes exercise every validation path so changes to this
          # routing logic validate themselves before merge.
          if ! git diff --quiet "$base" -- \
            .github/workflows/build-project.yml .github/workflows/blueprint.yml; then
            echo "lean=true" >> "$GITHUB_OUTPUT"
            echo "blueprint=true" >> "$GITHUB_OUTPUT"
            echo "homepage=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet "$base" -- \
            ':(glob)**/*.lean' lean-toolchain lakefile.toml lake-manifest.json \
            blueprint/lean_decls; then
            echo "lean=false" >> "$GITHUB_OUTPUT"
          else
            echo "lean=true" >> "$GITHUB_OUTPUT"
          fi

          if git diff --quiet "$base" -- blueprint/src blueprint/lean_decls; then
            echo "blueprint=false" >> "$GITHUB_OUTPUT"
          else
            echo "blueprint=true" >> "$GITHUB_OUTPUT"
          fi

          if git diff --quiet "$base" -- home_page; then
            echo "homepage=false" >> "$GITHUB_OUTPUT"
          else
            echo "homepage=true" >> "$GITHUB_OUTPUT"
          fi

  lean:
    needs: classify
    if: needs.classify.outputs.lean == 'true'
    runs-on: ubuntu-latest
    name: Validate Lean
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute Mathlib cache roots
        id: mathlib-cache-roots
        shell: bash
        run: |
          roots_file="$RUNNER_TEMP/mathlib-cache-roots.txt"
          grep -hRE --include='*.lean' '^[[:space:]]*import[[:space:]]+' \
            MorleyCategoricityTheorem.lean MorleyCategoricityTheorem \
            | sed -E 's/^[[:space:]]*import[[:space:]]+//' \
            | tr '[:space:]' '\n' \
            | grep -E '^Mathlib($|\.)' \
            | sort -u > "$roots_file"

          if [ ! -s "$roots_file" ]; then
            echo "No Mathlib imports found in project sources."
            exit 1
          fi

          echo "hash=$(sha256sum "$roots_file" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "file=$roots_file" >> "$GITHUB_OUTPUT"
          echo "Mathlib cache roots:"
          cat "$roots_file"

      # v3 caches only the transitive closure of Mathlib modules imported by this
      # project. The roots hash changes only when the Mathlib import boundary changes.
      - name: Restore Lean dependency cache
        id: dependency-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake/packages
          key: lake-packages-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ steps.mathlib-cache-roots.outputs.hash }}

      - name: Restore project build cache
        id: project-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake/build
          key: lake-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ hashFiles('MorleyCategoricityTheorem.lean', 'MorleyCategoricityTheorem/**/*.lean', 'lakefile.toml') }}
          restore-keys: |
            lake-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-

      - name: Set up Lean
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1.6.1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false

      - name: Fetch selective Mathlib cache
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mapfile -t roots < "${{ steps.mathlib-cache-roots.outputs.file }}"
          echo "Fetching cache for ${#roots[@]} directly imported Mathlib modules and their dependencies."
          ~/.elan/bin/lake exe cache get "${roots[@]}"

      - name: Build project
        run: ~/.elan/bin/lake build MorleyCategoricityTheorem checkdecls

      - name: Check root import file
        run: ~/.elan/bin/lake exe mk_all --check

      - name: Check blueprint declaration references
        run: ~/.elan/bin/lake exe checkdecls blueprint/lean_decls

      - name: Report Lean dependency cache size
        shell: bash
        run: |
          echo "Total package cache:"
          du -sh .lake/packages
          echo "Package build directories:"
          du -sh .lake/packages/*/.lake/build 2>/dev/null | sort -h || true
          echo "Package Git metadata:"
          du -sh .lake/packages/*/.git 2>/dev/null | sort -h || true

      - name: Save Lean dependency cache
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake/packages
          key: lake-packages-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ steps.mathlib-cache-roots.outputs.hash }}

      - name: Save project build cache
        if: steps.project-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake/build
          key: lake-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ hashFiles('MorleyCategoricityTheorem.lean', 'MorleyCategoricityTheorem/**/*.lean', 'lakefile.toml') }}

  blueprint:
    needs: classify
    if: needs.classify.outputs.blueprint == 'true'
    runs-on: ubuntu-latest
    name: Validate blueprint
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build blueprint
        uses: xu-cheng/texlive-action@f886de8159e5952a131848a5fa9c3196a2132b5d # v2
        with:
          docker_image: ghcr.io/xu-cheng/texlive-small:20250401
          run: |
            apk add --no-cache py3-pip git pkgconfig graphviz graphviz-dev gcc musl-dev
            git config --global --add safe.directory "$GITHUB_WORKSPACE"
            git config --global --add safe.directory "$(pwd)"
            python3 -m venv env
            source env/bin/activate
            pip install --no-cache-dir --upgrade pip wheel
            pip install --no-cache-dir pygraphviz \
              --config-settings="--global-option=build_ext" \
              --config-settings="--global-option=-L/usr/lib/graphviz/" \
              --config-settings="--global-option=-R/usr/lib/graphviz/"
            pip install --no-cache-dir leanblueprint
            leanblueprint pdf
            leanblueprint web
            mkdir -p home_page
            cp blueprint/print/print.pdf home_page/blueprint.pdf
            rm -rf home_page/blueprint
            cp -r blueprint/web home_page/blueprint

      - name: Check generated declaration list is committed
        shell: bash
        run: |
          if ! git diff --exit-code -- blueprint/lean_decls; then
            echo "blueprint/lean_decls is out of date; regenerate it with 'leanblueprint web' and commit the result."
            exit 1
          fi

      - name: Set up Ruby
        uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1.328.0
        with:
          working-directory: home_page
          ruby-version: default
          bundler-cache: true

      - name: Build homepage with generated blueprint
        working-directory: home_page
        env:
          JEKYLL_GITHUB_TOKEN: ${{ github.token }}
        run: JEKYLL_ENV=production bundle exec jekyll build --trace

  homepage:
    needs: classify
    if: needs.classify.outputs.homepage == 'true'
    runs-on: ubuntu-latest
    name: Validate homepage
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1.328.0
        with:
          working-directory: home_page
          ruby-version: default
          bundler-cache: true

      - name: Build homepage
        working-directory: home_page
        env:
          JEKYLL_GITHUB_TOKEN: ${{ github.token }}
        run: JEKYLL_ENV=production bundle exec jekyll build --trace

  validate:
    needs:
      - classify
      - lean
      - blueprint
      - homepage
    if: always()
    runs-on: ubuntu-latest
    name: Validate repository
    steps:
      - name: Check validation results
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          LEAN_RESULT: ${{ needs.lean.result }}
          BLUEPRINT_RESULT: ${{ needs.blueprint.result }}
          HOMEPAGE_RESULT: ${{ needs.homepage.result }}
        shell: bash
        run: |
          if [ "$CLASSIFY_RESULT" != "success" ]; then
            echo "Change classification failed: $CLASSIFY_RESULT"
            exit 1
          fi

          for result in "$LEAN_RESULT" "$BLUEPRINT_RESULT" "$HOMEPAGE_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "Validation job did not succeed: $result"
                exit 1
                ;;
            esac
          done
