name: Validate pull request

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    name: Classify changes
    outputs:
      lean: ${{ steps.changes.outputs.lean }}
      blueprint: ${{ steps.changes.outputs.blueprint }}
      homepage: ${{ steps.changes.outputs.homepage }}
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify changes
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "lean=true" >> "$GITHUB_OUTPUT"
            echo "blueprint=true" >> "$GITHUB_OUTPUT"
            echo "homepage=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="origin/${{ github.base_ref }}...HEAD"

          # Workflow changes exercise every validation path so changes to this
          # routing logic validate themselves before merge.
          if ! git diff --quiet "$base" -- \
            .github/workflows/build-project.yml .github/workflows/blueprint.yml; then
            echo "lean=true" >> "$GITHUB_OUTPUT"
            echo "blueprint=true" >> "$GITHUB_OUTPUT"
            echo "homepage=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet "$base" -- \
            ':(glob)**/*.lean' lean-toolchain lakefile.toml lake-manifest.json \
            blueprint/lean_decls; then
            echo "lean=false" >> "$GITHUB_OUTPUT"
          else
            echo "lean=true" >> "$GITHUB_OUTPUT"
          fi

          if git diff --quiet "$base" -- blueprint/src; then
            echo "blueprint=false" >> "$GITHUB_OUTPUT"
          else
            echo "blueprint=true" >> "$GITHUB_OUTPUT"
          fi

          if git diff --quiet "$base" -- home_page; then
            echo "homepage=false" >> "$GITHUB_OUTPUT"
          else
            echo "homepage=true" >> "$GITHUB_OUTPUT"
          fi

  lean:
    needs: classify
    if: needs.classify.outputs.lean == 'true'
    runs-on: ubuntu-latest
    name: Validate Lean
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build project
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1.6.1
        with:
          auto-config: false
          build: true
          build-args: MorleyCategoricityTheorem checkdecls
          use-github-cache: true
          use-mathlib-cache: true

      - name: Check root import file
        run: ~/.elan/bin/lake exe mk_all --check

      - name: Check blueprint declaration references
        run: ~/.elan/bin/lake exe checkdecls blueprint/lean_decls

  blueprint:
    needs: classify
    if: needs.classify.outputs.blueprint == 'true'
    runs-on: ubuntu-latest
    name: Validate blueprint
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build blueprint
        uses: xu-cheng/texlive-action@f886de8159e5952a131848a5fa9c3196a2132b5d # v2
        with:
          docker_image: ghcr.io/xu-cheng/texlive-small:20250401
          run: |
            apk add --no-cache py3-pip git pkgconfig graphviz graphviz-dev gcc musl-dev
            git config --global --add safe.directory "$GITHUB_WORKSPACE"
            git config --global --add safe.directory "$(pwd)"
            python3 -m venv env
            source env/bin/activate
            pip install --no-cache-dir --upgrade pip wheel
            pip install --no-cache-dir pygraphviz \
              --config-settings="--global-option=build_ext" \
              --config-settings="--global-option=-L/usr/lib/graphviz/" \
              --config-settings="--global-option=-R/usr/lib/graphviz/"
            pip install --no-cache-dir leanblueprint
            leanblueprint pdf
            leanblueprint web

  homepage:
    needs: classify
    if: needs.classify.outputs.homepage == 'true'
    runs-on: ubuntu-latest
    name: Validate homepage
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@eaecf785f6a34567a6d97f686bbb7bccc1ac1e5c # v1.237.0
        with:
          working-directory: home_page
          ruby-version: default
          bundler-cache: true

      - name: Build homepage
        working-directory: home_page
        env:
          JEKYLL_GITHUB_TOKEN: ${{ github.token }}
        run: JEKYLL_ENV=production bundle exec jekyll build --trace

  validate:
    needs:
      - classify
      - lean
      - blueprint
      - homepage
    if: always()
    runs-on: ubuntu-latest
    name: Validate repository
    steps:
      - name: Check validation results
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          LEAN_RESULT: ${{ needs.lean.result }}
          BLUEPRINT_RESULT: ${{ needs.blueprint.result }}
          HOMEPAGE_RESULT: ${{ needs.homepage.result }}
        shell: bash
        run: |
          if [ "$CLASSIFY_RESULT" != "success" ]; then
            echo "Change classification failed: $CLASSIFY_RESULT"
            exit 1
          fi

          for result in "$LEAN_RESULT" "$BLUEPRINT_RESULT" "$HOMEPAGE_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "Validation job did not succeed: $result"
                exit 1
                ;;
            esac
          done
