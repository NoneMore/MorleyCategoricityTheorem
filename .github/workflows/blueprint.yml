name: Build and deploy documentation

on:
  push:
    branches:
      - main
    paths:
      - '**/*.lean'
      - 'blueprint/**'
      - 'home_page/**'
      - 'references.bib'
      - 'lean-toolchain'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - '.github/workflows/blueprint.yml'
  workflow_dispatch:

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish_documentation:
    runs-on: ubuntu-latest
    name: Build and deploy documentation
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Build project
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1.6.1
        with:
          auto-config: false
          build: true
          build-args: MorleyCategoricityTheorem
          mk_all-check: true
          use-github-cache: true
          use-mathlib-cache: true

      - name: Compile and deploy blueprint and documentation
        uses: leanprover-community/docgen-action@dacc1acc2a3f532cc577266979ba9c36c7593f7c # 2026-10-05
        with:
          blueprint: true
          homepage: home_page
          ruby-version: default
