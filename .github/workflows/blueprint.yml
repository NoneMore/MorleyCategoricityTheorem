name: Build and deploy documentation

on:
  push:
    branches:
      - main
    paths:
      - '**/*.lean'
      - 'blueprint/**'
      - 'home_page/**'
      - 'references.bib'
      - 'lean-toolchain'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - '.github/workflows/blueprint.yml'
  workflow_dispatch:

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish_documentation:
    runs-on: ubuntu-latest
    name: Build and deploy documentation
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Restore Lean dependency cache
        id: dependency-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake/packages
          key: lake-packages-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}

      # One-way migration path from lean-action's former monolithic .lake cache.
      # Once a split dependency cache exists, this step is skipped.
      - name: Restore legacy monolithic Lean cache
        id: legacy-cache
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ./.lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}

      - name: Restore project build cache
        id: project-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake/build
          key: lake-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ hashFiles('MorleyCategoricityTheorem.lean', 'MorleyCategoricityTheorem/**/*.lean', 'lakefile.toml') }}
          restore-keys: |
            lake-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-

      - name: Build project
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1.6.1
        with:
          auto-config: false
          build: true
          build-args: MorleyCategoricityTheorem checkdecls
          use-github-cache: false
          use-mathlib-cache: ${{ steps.dependency-cache.outputs.cache-hit != 'true' && steps.legacy-cache.outputs.cache-matched-key == '' }}

      - name: Check root import file
        run: ~/.elan/bin/lake exe mk_all --check

      - name: Save Lean dependency cache
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake/packages
          key: lake-packages-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}

      - name: Save project build cache
        if: steps.project-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake/build
          key: lake-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ hashFiles('MorleyCategoricityTheorem.lean', 'MorleyCategoricityTheorem/**/*.lean', 'lakefile.toml') }}

      - name: Compile and deploy blueprint and documentation
        uses: leanprover-community/docgen-action@dacc1acc2a3f532cc577266979ba9c36c7593f7c # 2026-10-05
        with:
          blueprint: true
          homepage: home_page
          ruby-version: default
