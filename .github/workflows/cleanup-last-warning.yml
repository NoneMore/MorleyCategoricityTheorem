name: Cleanup final Mathlib warning

on:
  push:
    branches:
      - chore/upgrade-mathlib-v4.34.1

permissions:
  contents: write

jobs:
  cleanup:
    if: "${{ github.event.head_commit.message != 'chore: remove final Mathlib 4.34 warning' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upgrade branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/upgrade-mathlib-v4.34.1

      - name: Apply final style migration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("MorleyCategoricityTheorem/ModelTheory/DefinablyFull.lean")
          lines = p.read_text().splitlines(keepends=True)
          n = 239
          if "haveI" not in lines[n - 1]:
              raise SystemExit(f"expected haveI at {p}:{n}, got {lines[n - 1]!r}")
          lines[n - 1] = lines[n - 1].replace("haveI", "have", 1)
          p.write_text("".join(lines))
          Path(".github/workflows/cleanup-last-warning.yml").unlink()
          PY

      - name: Build affected module
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1.6.1
        with:
          auto-config: false
          build: true
          build-args: MorleyCategoricityTheorem.ModelTheory.DefinablyFull
          use-github-cache: true
          use-mathlib-cache: true

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: remove final Mathlib 4.34 warning"
          git push origin HEAD:chore/upgrade-mathlib-v4.34.1
