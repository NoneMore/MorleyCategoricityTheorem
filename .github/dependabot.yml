version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "bundler"
    directory: "/home_page"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/blueprint"
    schedule:
      interval: "weekly"
    groups:
      blueprint-ci:
        patterns:
          - "*"
